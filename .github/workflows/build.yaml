name: Build BetterScan

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1
        with:
          nuget-version: 'latest'

      - name: Restore NuGet packages
        run: nuget restore BetterScan.csproj -OutputDirectory packages -NonInteractive -Verbosity detailed

      - name: Verify Ookii.Dialogs.Wpf was restored
        shell: pwsh
        run: |
          $packageRoot = "packages\Ookii.Dialogs.Wpf.5.0.1"
          if (-not (Test-Path $packageRoot)) {
            Write-Error "ERRO: Pasta do pacote Ookii não existe: $packageRoot"
            Get-ChildItem "packages" -Directory | Select-Object Name
            exit 1
          }
          Write-Host "Conteúdo de $packageRoot\lib:"
          Get-ChildItem "$packageRoot\lib" -Directory | Select-Object Name
          $dll = Get-ChildItem "$packageRoot\lib" -Recurse -Filter "Ookii.Dialogs.Wpf.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Error "ERRO: Ookii.Dialogs.Wpf.dll não encontrado dentro de $packageRoot\lib"
            exit 1
          }
          Write-Host "OK: DLL encontrada em $($dll.FullName)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Build with MSBuild
        run: msbuild BetterScan.csproj /p:Configuration=Release /p:Platform="AnyCPU" /p:OutputPath=bin\Release\ /m

      - name: Verify build output
        shell: pwsh
        run: |
          $dll = "bin\Release\BetterScan.dll"
          if (-not (Test-Path $dll)) { Write-Error "Build falhou: $dll não foi gerado"; exit 1 }
          Write-Host "Build OK: $dll gerado com sucesso"

      - name: Create .pext package
        shell: pwsh
        run: |
          $packageFiles = @(
            "bin\Release\*.dll",
            "bin\Release\extension.yaml",
            "bin\Release\icon.png"
          )
          if (Test-Path "bin\Release\Localization") {
            $packageFiles += "bin\Release\Localization"
          }
          Compress-Archive -Path $packageFiles -DestinationPath "BetterScan.pext" -Force
          Write-Host "Created BetterScan.pext ($([math]::Round((Get-Item BetterScan.pext).Length / 1MB, 2)) MB)"

      - name: Upload .pext artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterScan-pext
          path: BetterScan.pext

      - name: Upload raw build output
        uses: actions/upload-artifact@v4
        with:
          name: BetterScan-Raw
          path: bin\Release\